name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17 (requerido pelo PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes (formato parquet, hermético)
        env:
          TABLE_FORMAT: parquet
          STORAGE_BACKEND: local
        run: pytest -v

      - name: Pipeline end-to-end (smoke, sem Postgres)
        env:
          TABLE_FORMAT: parquet
          STORAGE_BACKEND: local
          TICKETS_PER_RUN: "2000"
        run: python -m servicedesk_pipeline.run_pipeline --no-postgres
