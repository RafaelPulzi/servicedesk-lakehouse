# Serviços de apoio para rodar o pipeline localmente.
#   postgres -> camada de consumo (marts gold)
#   minio    -> S3 local (opcional) para exercitar o backend=s3 sem AWS
#
# Uso:
#   docker compose up -d postgres          # só o banco de consumo
#   docker compose up -d                   # banco + MinIO (S3 local)

services:
  postgres:
    image: postgres:16-alpine
    container_name: servicedesk-postgres
    environment:
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: servicedesk
      POSTGRES_DB: servicedesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opcional: S3 local para testar o backend=s3 sem conta AWS.
  minio:
    image: minio/minio:latest
    container_name: servicedesk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
